# Truma iNet X -> Home Assistant, directly via an ESP32
#
# The ESP connects to the iNet X panel over Bluetooth by itself and keeps the
# connection. Home Assistant only talks to the ESP via the ESPHome API (WiFi)
# -- no Bluetooth proxy, no HA integration needed.
#
# Read the README before pairing (section "Pairing step by step").
# The device addresses (address: 0x0201 etc.) fit panel + one heater + EBL.
# To see which devices you have: button "Dump All Parameters to Log".

esphome:
  name: truma-inetx
  friendly_name: Truma iNet X
  min_version: 2025.11.0

esp32:
  board: esp32dev          # classic ESP32 -- NOT C3/S3/C6, see README
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Truma Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

# --- Truma iNet X ---------------------------------------------------------
external_components:
  - source: github://Moormerlander/esphome-truma-inetx@main
    components: [truma_inetx]
  # Local instead of GitHub: put the "components" folder next to this file and use
  #   - source: { type: local, path: components }

time:
  - platform: homeassistant
    id: ha_time

esp32_ble_tracker:
  scan_parameters:
    active: true

truma_inetx:
  id: truma_hub
  time_id: ha_time
  user_name: "Home Assistant"
  pairing_timeout: 120s
  language: en              # language of the status texts
  privacy: false

binary_sensor:
  # --- Power distribution unit (EBL, 0x0405) ---
  - platform: truma_inetx
    topic: PowerSupply
    param: MainSwitch
    address: 0x0405
    name: "12V Main Switch"
    device_class: power
  - platform: truma_inetx
    topic: PowerSupply
    param: 12VPower
    address: 0x0405
    name: "12V Supply"
    device_class: power
  - platform: truma_inetx
    topic: Switches
    param: Active
    address: 0x0405
    name: "EBL Switch Output Active"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: FreshWater
    param: Autofill
    address: 0x0405
    name: "Fresh Water Autofill"
    entity_category: diagnostic
  # --- Heater (Combi, 0x0201) ---
  - platform: truma_inetx
    topic: AirCirculation
    param: Active
    address: 0x0201
    on_values: [1]
    name: "Air Circulation Active"
    device_class: running
  - platform: truma_inetx
    topic: EnergySrc
    param: NeedsEnergySrc
    address: 0x0201
    name: "Heater Needs Energy Source"
    entity_category: diagnostic
  - platform: truma_inetx
    type: connected
    name: "Panel Connected"
    device_class: connectivity
  - platform: truma_inetx
    type: paired
    name: "Panel Paired"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: AirHeating
    param: Active
    address: 0x0201
    on_values: [1]
    name: "Heating Active"
    device_class: running
  - platform: truma_inetx
    topic: WaterHeating
    param: Active
    address: 0x0201
    on_values: [1]
    name: "Hot Water Active"
    device_class: running
  - platform: truma_inetx
    topic: System
    param: FlameStatus
    on_values: [1]
    name: "Burner"
    device_class: heat
  - platform: truma_inetx
    topic: LinePower
    param: Plugged
    address: 0x0405
    name: "Shore Power"
    device_class: plug
  - platform: truma_inetx
    topic: ErrorReset
    param: ErrCode
    name: "Fault"
    device_class: problem

text_sensor:
  # --- Device firmware ---
  - platform: truma_inetx
    format: firmware
    address: 0x0101
    name: "Panel Firmware"
    entity_category: diagnostic
  - platform: truma_inetx
    format: firmware
    address: 0x0201
    name: "Heater Firmware"
    entity_category: diagnostic
  - platform: truma_inetx
    format: firmware
    address: 0x0405
    name: "EBL Firmware"
    entity_category: diagnostic
  # --- Panel clock ---
  - platform: truma_inetx
    topic: TimeAndDate
    param: Time
    address: 0x0101
    name: "Panel Time"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: TimeAndDate
    param: Date
    address: 0x0101
    name: "Panel Date"
    entity_category: diagnostic
  - platform: truma_inetx
    type: version
    name: "Firmware Version"
    entity_category: diagnostic
  - platform: truma_inetx
    type: last_disconnect
    name: "Last Disconnect"
    entity_category: diagnostic
  - platform: truma_inetx
    type: link_params
    name: "Radio Link"
    entity_category: diagnostic
  - platform: truma_inetx
    type: status
    name: "Connection Status"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: ErrorReset
    param: ErrCode
    name: "Error Codes"
    entity_category: diagnostic
  # Bluetooth module of the panel (bus address 0x0601) -- for troubleshooting
  - platform: truma_inetx
    topic: BleDeviceManagement
    param: NrFreeSlots
    address: 0x0601
    name: "BLE Free Slots"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: BleDeviceManagement
    param: State
    address: 0x0601
    name: "BLE Module State"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: BleDeviceManagement
    param: BleConnState
    address: 0x0601
    name: "BLE Module Connection State"
    entity_category: diagnostic

  # --- Timers (panel) ---
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer1
    address: 0x0101
    format: timer
    name: "Timer 1 Schedule"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer2
    address: 0x0101
    format: timer
    name: "Timer 2 Schedule"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer3
    address: 0x0101
    format: timer
    name: "Timer 3 Schedule"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer4
    address: 0x0101
    format: timer
    name: "Timer 4 Schedule"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer5
    address: 0x0101
    format: timer
    name: "Timer 5 Schedule"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer6
    address: 0x0101
    format: timer
    name: "Timer 6 Schedule"

button:
  - platform: truma_inetx
    type: pair
    name: "Pair Panel"
    entity_category: config
  - platform: truma_inetx
    type: unpair
    name: "Remove Pairing"
    entity_category: config
  - platform: truma_inetx
    type: reconnect
    name: "Reconnect"
    entity_category: diagnostic
  - platform: truma_inetx
    type: dump
    name: "Dump All Parameters to Log"
    entity_category: diagnostic
  - platform: truma_inetx
    type: measure
    name: "Measure Tanks"
  - platform: truma_inetx
    type: write
    topic: ErrorReset
    param: Req
    value: 1
    name: "Reset Fault"

climate:
  - platform: truma_inetx
    name: "Heater"
    supported_modes: [HEAT, FAN_ONLY]
    appliance_address: 0x0201

sensor:
  - platform: truma_inetx
    topic: AirHeating
    param: Temp
    address: 0x0201
    name: "Room Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: WaterHeating
    param: Temp
    address: 0x0201
    name: "Water Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: VBat
    param: Voltage
    address: 0x0405
    name: "Starter Battery"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: L1Bat
    param: Voltage
    address: 0x0405
    name: "Leisure Battery"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: FreshWater
    param: Level
    address: 0x0405
    name: "Fresh Water"
    unit_of_measurement: "%"
    state_class: measurement
  - platform: truma_inetx
    topic: GreyWater
    param: Level
    address: 0x0405
    name: "Grey Water"
    unit_of_measurement: "%"
    state_class: measurement
  # --- Panel ---
  - platform: truma_inetx
    topic: Temperature
    param: Internal
    address: 0x0101
    name: "Panel Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: Eol
    param: Vcc12
    address: 0x0101
    name: "Panel Supply Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    filters:
      - multiply: 0.001
  - platform: truma_inetx
    topic: PowerMgmt
    param: PwrMode
    address: 0x0101
    name: "Panel Power Mode"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: Panel
    param: UserInactiveSince
    address: 0x0101
    name: "Panel Idle Since"
    unit_of_measurement: "s"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: TimerConfig
    param: TimerEnableCount
    address: 0x0101
    name: "Timers Enabled"
    entity_category: diagnostic
  # --- Heater (Combi) ---
  - platform: truma_inetx
    topic: AirHeating
    param: TgtTemp
    address: 0x0201
    name: "Heater Target Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: RoomClimate
    param: TgtTemp
    address: 0x0101
    name: "Room Climate Target Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: EnergySrc
    param: GasLevel
    address: 0x0201
    name: "Gas Level"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: WaterHeating
    param: FasterHeatingModeTime
    address: 0x0201
    name: "Hot Water Boost Remaining"
    unit_of_measurement: "min"
    entity_category: diagnostic
  # --- Power distribution unit (EBL) ---
  - platform: truma_inetx
    topic: VBat
    param: State
    address: 0x0405
    name: "Starter Battery State"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: L1Bat
    param: State
    address: 0x0405
    name: "Leisure Battery State"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: FreshWater
    param: State
    address: 0x0405
    name: "Fresh Water Sensor State"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: GreyWater
    param: State
    address: 0x0405
    name: "Grey Water Sensor State"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

number:
  - platform: truma_inetx
    topic: Panel
    param: Intst
    address: 0x0101
    name: "Display Brightness"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    entity_category: config
  - platform: truma_inetx
    topic: Panel
    param: DarkIntst
    address: 0x0101
    name: "Display Brightness Dark"
    min_value: 0
    max_value: 100
    step: 1
    entity_category: config
  - platform: truma_inetx
    topic: Panel
    param: DisplayTimeout
    address: 0x0101
    name: "Display Timeout"
    unit_of_measurement: "s"
    min_value: 10
    max_value: 600
    step: 10
    entity_category: config
  - platform: truma_inetx
    topic: AirCirculation
    param: FanLevel
    address: 0x0201
    name: "Fan Level"
    min_value: 0
    max_value: 10
    step: 1

select:
  - platform: truma_inetx
    topic: WaterHeating
    param: Mode
    address: 0x0201
    name: "Hot Water Mode"
    options:
      0: "Eco (40 °C)"
      1: "Comfort (60 °C)"
      2: "Hot (70 °C)"
  - platform: truma_inetx
    topic: AirHeating
    param: Mode
    address: 0x0201
    name: "Heating Mode"
    options:
      0: "Fast"
      1: "Comfort"

switch:
  - platform: truma_inetx
    topic: WaterHeating
    param: Active
    address: 0x0201
    name: "Hot Water"
  - platform: truma_inetx
    topic: WaterHeating
    param: FasterHeatingMode
    address: 0x0201
    name: "Hot Water Boost"
  - platform: truma_inetx
    topic: Switches
    param: FreshWaterPump
    address: 0x0405
    name: "Water Pump"
  - platform: truma_inetx
    topic: Panel
    param: Screensaver
    address: 0x0101
    name: "Screensaver"
    entity_category: config
  # --- Timers on/off (panel) ---
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer1State
    address: 0x0101
    name: "Timer 1"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer2State
    address: 0x0101
    name: "Timer 2"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer3State
    address: 0x0101
    name: "Timer 3"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer4State
    address: 0x0101
    name: "Timer 4"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer5State
    address: 0x0101
    name: "Timer 5"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer6State
    address: 0x0101
    name: "Timer 6"
