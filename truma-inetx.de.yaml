# Truma iNet X -> Home Assistant, direkt per ESP32
#
# Der ESP verbindet sich selbst per Bluetooth mit dem iNet X Panel und haelt
# die Verbindung. Home Assistant spricht nur noch ueber die ESPHome-API (WLAN)
# mit dem ESP -- kein Bluetooth-Proxy, keine HA-Integration noetig.
#
# Vor dem Koppeln unbedingt die README lesen (Abschnitt "Kopplung Schritt fuer Schritt").
# Die Geraeteadressen (address: 0x0201 usw.) passen fuer Panel + eine Heizung + EBL.
# Welche Geraete es bei dir gibt: Button "Alle Parameter ins Log".

esphome:
  name: truma-inetx
  friendly_name: Truma iNet X
  min_version: 2025.11.0

esp32:
  board: esp32dev          # klassischer ESP32 -- KEIN C3/S3/C6, siehe README
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Truma Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

# --- Truma iNet X ---------------------------------------------------------
external_components:
  - source: github://Moormerlander/esphome-truma-inetx@main
    components: [truma_inetx]
  # Lokal statt GitHub: Ordner "components" neben diese Datei legen und
  #   - source: { type: local, path: components }

time:
  - platform: homeassistant
    id: ha_time

esp32_ble_tracker:
  scan_parameters:
    active: true

truma_inetx:
  id: truma_hub
  time_id: ha_time
  user_name: "Home Assistant"
  pairing_timeout: 120s
  language: de              # Sprache der Statustexte
  privacy: false

binary_sensor:
  # --- Elektroblock (EBL, 0x0405) ---
  - platform: truma_inetx
    topic: PowerSupply
    param: MainSwitch
    address: 0x0405
    name: "12V-Hauptschalter"
    device_class: power
  - platform: truma_inetx
    topic: PowerSupply
    param: 12VPower
    address: 0x0405
    name: "12V-Versorgung"
    device_class: power
  - platform: truma_inetx
    topic: Switches
    param: Active
    address: 0x0405
    name: "EBL Schaltausgang aktiv"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: FreshWater
    param: Autofill
    address: 0x0405
    name: "Frischwasser Autofill"
    entity_category: diagnostic
  # --- Heizung (Combi, 0x0201) ---
  - platform: truma_inetx
    topic: AirCirculation
    param: Active
    address: 0x0201
    on_values: [1]
    name: "Umluft aktiv"
    device_class: running
  - platform: truma_inetx
    topic: EnergySrc
    param: NeedsEnergySrc
    address: 0x0201
    name: "Heizung braucht Energiequelle"
    entity_category: diagnostic
  - platform: truma_inetx
    type: connected
    name: "Panel verbunden"
    device_class: connectivity
  - platform: truma_inetx
    type: paired
    name: "Panel gekoppelt"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: AirHeating
    param: Active
    address: 0x0201
    on_values: [1]
    name: "Heizung aktiv"
    device_class: running
  - platform: truma_inetx
    topic: WaterHeating
    param: Active
    address: 0x0201
    on_values: [1]
    name: "Warmwasser aktiv"
    device_class: running
  - platform: truma_inetx
    topic: System
    param: FlameStatus
    on_values: [1]
    name: "Brenner"
    device_class: heat
  - platform: truma_inetx
    topic: LinePower
    param: Plugged
    address: 0x0405
    name: "Landstrom"
    device_class: plug
  - platform: truma_inetx
    topic: ErrorReset
    param: ErrCode
    name: "Störung"
    device_class: problem

text_sensor:
  # --- Firmware der Geräte ---
  - platform: truma_inetx
    format: firmware
    address: 0x0101
    name: "Panel-Firmware"
    entity_category: diagnostic
  - platform: truma_inetx
    format: firmware
    address: 0x0201
    name: "Heizung-Firmware"
    entity_category: diagnostic
  - platform: truma_inetx
    format: firmware
    address: 0x0405
    name: "EBL-Firmware"
    entity_category: diagnostic
  # --- Panel-Uhr ---
  - platform: truma_inetx
    topic: TimeAndDate
    param: Time
    address: 0x0101
    name: "Panel-Uhrzeit"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: TimeAndDate
    param: Date
    address: 0x0101
    name: "Panel-Datum"
    entity_category: diagnostic
  - platform: truma_inetx
    type: version
    name: "Firmware-Version"
    entity_category: diagnostic
  - platform: truma_inetx
    type: last_disconnect
    name: "Letzte Trennung"
    entity_category: diagnostic
  - platform: truma_inetx
    type: link_params
    name: "Funkverbindung"
    entity_category: diagnostic
  - platform: truma_inetx
    type: status
    name: "Verbindungsstatus"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: ErrorReset
    param: ErrCode
    name: "Fehlercodes"
    entity_category: diagnostic
  # Bluetooth-Modul des Panels (Bus-Adresse 0x0601) -- zur Fehlersuche
  - platform: truma_inetx
    topic: BleDeviceManagement
    param: NrFreeSlots
    address: 0x0601
    name: "BLE freie Plätze"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: BleDeviceManagement
    param: State
    address: 0x0601
    name: "BLE-Modul Zustand"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: BleDeviceManagement
    param: BleConnState
    address: 0x0601
    name: "BLE-Modul Verbindungszustand"
    entity_category: diagnostic

  # --- Zeitschaltuhren (Panel) ---
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer1
    address: 0x0101
    format: timer
    name: "Zeitschaltuhr 1 Zeitplan"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer2
    address: 0x0101
    format: timer
    name: "Zeitschaltuhr 2 Zeitplan"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer3
    address: 0x0101
    format: timer
    name: "Zeitschaltuhr 3 Zeitplan"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer4
    address: 0x0101
    format: timer
    name: "Zeitschaltuhr 4 Zeitplan"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer5
    address: 0x0101
    format: timer
    name: "Zeitschaltuhr 5 Zeitplan"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer6
    address: 0x0101
    format: timer
    name: "Zeitschaltuhr 6 Zeitplan"

button:
  - platform: truma_inetx
    type: pair
    name: "Panel koppeln"
    entity_category: config
  - platform: truma_inetx
    type: unpair
    name: "Kopplung löschen"
    entity_category: config
  - platform: truma_inetx
    type: reconnect
    name: "Neu verbinden"
    entity_category: diagnostic
  - platform: truma_inetx
    type: dump
    name: "Alle Parameter ins Log"
    entity_category: diagnostic
  - platform: truma_inetx
    type: measure
    name: "Tanks neu messen"
  - platform: truma_inetx
    type: write
    topic: ErrorReset
    param: Req
    value: 1
    name: "Störung zurücksetzen"

climate:
  - platform: truma_inetx
    name: "Heizung"
    supported_modes: [HEAT, FAN_ONLY]
    appliance_address: 0x0201

sensor:
  - platform: truma_inetx
    topic: AirHeating
    param: Temp
    address: 0x0201
    name: "Raumtemperatur"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: WaterHeating
    param: Temp
    address: 0x0201
    name: "Wassertemperatur"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: VBat
    param: Voltage
    address: 0x0405
    name: "Starterbatterie"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: L1Bat
    param: Voltage
    address: 0x0405
    name: "Aufbaubatterie"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: FreshWater
    param: Level
    address: 0x0405
    name: "Frischwasser"
    unit_of_measurement: "%"
    state_class: measurement
  - platform: truma_inetx
    topic: GreyWater
    param: Level
    address: 0x0405
    name: "Abwasser"
    unit_of_measurement: "%"
    state_class: measurement
  # --- Panel ---
  - platform: truma_inetx
    topic: Temperature
    param: Internal
    address: 0x0101
    name: "Panel-Temperatur"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: Eol
    param: Vcc12
    address: 0x0101
    name: "Panel-Versorgungsspannung"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    filters:
      - multiply: 0.001
  - platform: truma_inetx
    topic: PowerMgmt
    param: PwrMode
    address: 0x0101
    name: "Panel Energiemodus"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: Panel
    param: UserInactiveSince
    address: 0x0101
    name: "Panel unbenutzt seit"
    unit_of_measurement: "s"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: TimerConfig
    param: TimerEnableCount
    address: 0x0101
    name: "Zeitschaltuhren aktiv"
    entity_category: diagnostic
  # --- Heizung (Combi) ---
  - platform: truma_inetx
    topic: AirHeating
    param: TgtTemp
    address: 0x0201
    name: "Heizung Solltemperatur"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: RoomClimate
    param: TgtTemp
    address: 0x0101
    name: "Raumklima Solltemperatur"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
  - platform: truma_inetx
    topic: EnergySrc
    param: GasLevel
    address: 0x0201
    name: "Gas-Stufe"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: WaterHeating
    param: FasterHeatingModeTime
    address: 0x0201
    name: "Warmwasser Vorrang Restzeit"
    unit_of_measurement: "min"
    entity_category: diagnostic
  # --- Elektroblock (EBL) ---
  - platform: truma_inetx
    topic: VBat
    param: State
    address: 0x0405
    name: "Starterbatterie Status"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: L1Bat
    param: State
    address: 0x0405
    name: "Aufbaubatterie Status"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: FreshWater
    param: State
    address: 0x0405
    name: "Frischwasser Sensorstatus"
    entity_category: diagnostic
  - platform: truma_inetx
    topic: GreyWater
    param: State
    address: 0x0405
    name: "Abwasser Sensorstatus"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "WLAN-Signal"
    update_interval: 60s
    entity_category: diagnostic

number:
  - platform: truma_inetx
    topic: Panel
    param: Intst
    address: 0x0101
    name: "Display-Helligkeit"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    entity_category: config
  - platform: truma_inetx
    topic: Panel
    param: DarkIntst
    address: 0x0101
    name: "Display-Helligkeit dunkel"
    min_value: 0
    max_value: 100
    step: 1
    entity_category: config
  - platform: truma_inetx
    topic: Panel
    param: DisplayTimeout
    address: 0x0101
    name: "Display-Timeout"
    unit_of_measurement: "s"
    min_value: 10
    max_value: 600
    step: 10
    entity_category: config
  - platform: truma_inetx
    topic: AirCirculation
    param: FanLevel
    address: 0x0201
    name: "Lüfterstufe"
    min_value: 0
    max_value: 10
    step: 1

select:
  - platform: truma_inetx
    topic: WaterHeating
    param: Mode
    address: 0x0201
    name: "Warmwasser-Modus"
    options:
      0: "Eco (40 °C)"
      1: "Comfort (60 °C)"
      2: "Hot (70 °C)"
  - platform: truma_inetx
    topic: AirHeating
    param: Mode
    address: 0x0201
    name: "Heizleistung"
    options:
      0: "Schnell"
      1: "Komfort"

switch:
  - platform: truma_inetx
    topic: WaterHeating
    param: Active
    address: 0x0201
    name: "Warmwasser"
  - platform: truma_inetx
    topic: WaterHeating
    param: FasterHeatingMode
    address: 0x0201
    name: "Warmwasser Vorrang"
  - platform: truma_inetx
    topic: Switches
    param: FreshWaterPump
    address: 0x0405
    name: "Wasserpumpe"
  - platform: truma_inetx
    topic: Panel
    param: Screensaver
    address: 0x0101
    name: "Bildschirmschoner"
    entity_category: config
  # --- Zeitschaltuhren an/aus (Panel) ---
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer1State
    address: 0x0101
    name: "Zeitschaltuhr 1"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer2State
    address: 0x0101
    name: "Zeitschaltuhr 2"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer3State
    address: 0x0101
    name: "Zeitschaltuhr 3"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer4State
    address: 0x0101
    name: "Zeitschaltuhr 4"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer5State
    address: 0x0101
    name: "Zeitschaltuhr 5"
  - platform: truma_inetx
    topic: TimerConfig
    param: Timer6State
    address: 0x0101
    name: "Zeitschaltuhr 6"
